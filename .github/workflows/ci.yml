name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race
      - name: install --dry-run smoke test
        # Hits the real GitHub API for neovim/neovim's latest release
        # metadata (to report what --dry-run would do) but performs zero
        # downloads or writes — the one intentional exception to "no
        # network" in the rest of the test suite.
        run: go run ./cmd/nvimforge install --dry-run --lang go --lang lua --yes --deploy-path ${{ runner.temp }}/nvimforge-ci-deploy

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v6
