name: Release

on:
  push:
    tags:
      # Tool-scoped tags, e.g. nvimforge/v1.2.3, so each tool versions
      # independently. GoReleaser's own monorepo support (monorepo.tag_prefix)
      # is Pro-only, so the prefix is parsed here instead.
      - "*/v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tool and version from tag
        id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          tool="${tag%/*}"
          version="${tag##*/}"

          # A missing directory means the tag names something that doesn't
          # exist — almost certainly a typo, and worth failing loudly.
          if [ ! -d "$tool" ]; then
            echo "::error::tag '$tag' names '$tool', but no such directory exists"
            exit 1
          fi

          # A module with no .goreleaser.yaml is a library (forge), not a
          # CLI. Tagging one is legitimate — Go resolves library versions
          # from exactly these tags — so skip cleanly rather than failing
          # the run and leaving a red X on a correct action.
          if [ ! -f "$tool/.goreleaser.yaml" ]; then
            echo "::notice::$tool is a library module (no .goreleaser.yaml); nothing to release for $tag"
            echo "releasable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "releasable=true" >> "$GITHUB_OUTPUT"
          echo "tool=$tool" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $tool $version"

      - uses: actions/setup-go@v5
        if: steps.tag.outputs.releasable == 'true'
        with:
          go-version-file: ${{ steps.tag.outputs.tool }}/go.mod
          cache-dependency-path: ${{ steps.tag.outputs.tool }}/go.sum

      - uses: goreleaser/goreleaser-action@v6
        if: steps.tag.outputs.releasable == 'true'
        with:
          distribution: goreleaser
          version: latest
          workdir: ${{ steps.tag.outputs.tool }}
          # Build and archive only — the GitHub release is created in the next
          # step. GoReleaser OSS can't publish against a prefixed tag, and
          # pointing it at the bare version would have it create a second,
          # unprefixed `vX.Y.Z` tag that every tool in the repo would collide
          # over. GORELEASER_CURRENT_TAG still feeds the right value into the
          # buildinfo ldflags; --skip=validate stops it objecting that the
          # bare tag isn't the checked-out ref.
          args: release --clean --skip=publish,validate
        env:
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.version }}

      - name: Publish GitHub release
        if: steps.tag.outputs.releasable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOOL: ${{ steps.tag.outputs.tool }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${TOOL} ${VERSION}" \
            --generate-notes \
            "${TOOL}"/dist/*.tar.gz \
            "${TOOL}"/dist/*.zip \
            "${TOOL}"/dist/checksums.txt
