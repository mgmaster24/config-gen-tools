version: 2
project_name: nvimforge

before:
  hooks:
    - go mod tidy

builds:
  - id: nvimforge
    main: ./cmd/nvimforge
    binary: nvimforge
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/mgmaster24/nvimforge/internal/buildinfo.Version={{.Version}}
      - -X github.com/mgmaster24/nvimforge/internal/buildinfo.Commit={{.Commit}}
      - -X github.com/mgmaster24/nvimforge/internal/buildinfo.Date={{.Date}}

archives:
  - id: nvimforge
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# No `release:` block: the GitHub release for a tool-scoped tag
# (nvimforge/v1.2.3) is created by .github/workflows/release.yml, which runs
# goreleaser with --skip=publish. An explicit release target here previously
# pointed at mgmaster24/nvimforge, which does not exist.

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

# Homebrew tap / Scoop bucket manifests can be added here once a
# homebrew-tap / scoop-bucket repo exists — intentionally deferred, not a
# v1 blocker (see brews:/scoops: in goreleaser docs).
